<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Review · Both Sides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="stylesheet" href="review.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <a href="/" class="brand-name">Both Sides</a>
        <span class="brand-tag">Reviewer page</span>
      </div>
      <div class="header-right">
        <span id="who" class="muted small"></span>
        <button type="button" id="sign-out" class="btn-suggest" hidden>Sign out</button>
        <a href="/" class="btn-suggest as-link">View the site</a>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div id="flash" class="flash" role="status" hidden></div>
    <div id="notice" class="notice" hidden></div>

    <!-- Sign in -->
    <section id="signin" class="signin" hidden>
      <form id="signin-form" class="form">
        <h1>Reviewer sign-in</h1>
        <p class="muted small" id="signin-help">For reviewers only. Reviewer accounts are created by the site owner; there is no public sign-up.</p>
        <label>Email
          <input name="email" type="email" required autocomplete="username">
        </label>
        <label>Password
          <input name="password" type="password" required minlength="8" autocomplete="current-password">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-dark" id="signin-btn">Sign in</button>
        </div>
        <p class="form-msg" role="status" id="signin-msg"></p>
      </form>
    </section>

    <!-- Signed in -->
    <section id="panel" hidden>
      <nav class="review-tabs" aria-label="Review sections">
        <button type="button" class="tab" data-view="queue" aria-pressed="true">Waiting for review <span id="queue-count" class="count"></span></button>
        <button type="button" class="tab" data-view="live" aria-pressed="false">Live content</button>
        <button type="button" class="tab" data-view="log" aria-pressed="false">Decision log</button>
      </nav>
      <div id="view"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=8"></script>
  <script src="ai-instructions.js?v=8"></script>
  <script src="review.js?v=8"></script>
</body>
</html>
